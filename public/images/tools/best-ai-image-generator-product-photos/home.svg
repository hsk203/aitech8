<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="AI product photo workflow: one phone photo becomes a white packshot, a lifestyle scene, and a listing infographic">
  <rect width="1200" height="900" fill="#eaf3f1"/>
  <rect x="0" y="0" width="1200" height="120" fill="#0f4c4c"/>
  <text x="600" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">Best AI Image Generator for Product Photos</text>
  <text x="600" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#a8d8d0" text-anchor="middle">One phone photo in — three listing-ready shots out</text>

  <!-- Conveyor baseline -->
  <line x1="60" y1="640" x2="1140" y2="640" stroke="#0f4c4c" stroke-width="4" stroke-dasharray="14 10" stroke-linecap="round"/>

  <!-- Raw phone photo (left, tilted) -->
  <g transform="rotate(-4 230 400)">
    <rect x="130" y="240" width="200" height="320" rx="18" fill="#1d2b2b"/>
    <rect x="142" y="252" width="176" height="296" rx="10" fill="#d8ddd8"/>
    <rect x="142" y="252" width="176" height="40" rx="10" fill="#8a9a94"/>
    <circle cx="230" cy="300" r="10" fill="#5a6b66"/>
    <!-- bottle sketch -->
    <rect x="205" y="360" width="50" height="110" rx="12" fill="#3f7d6e"/>
    <rect x="218" y="340" width="24" height="22" rx="4" fill="#2e5d52"/>
    <rect x="205" y="400" width="50" height="34" fill="#f4f1e6"/>
    <text x="230" y="422" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f4c4c" text-anchor="middle">SKU</text>
    <text x="230" y="520" font-family="Arial, sans-serif" font-size="17" fill="#3a4a46" text-anchor="middle">phone photo</text>
  </g>

  <!-- Arrow into AI -->
  <path d="M 350 400 L 420 400 M 405 385 L 425 400 L 405 415" stroke="#c96a2e" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI badge -->
  <g>
    <circle cx="480" cy="400" r="62" fill="#0f4c4c"/>
    <circle cx="480" cy="400" r="62" fill="none" stroke="#7fc4b8" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="480" y="414" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">AI</text>
  </g>

  <!-- Arrow out -->
  <path d="M 550 400 L 620 400 M 605 385 L 625 400 L 605 415" stroke="#c96a2e" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Shelf of three listing outputs (right) -->
  <g>
    <!-- 1 white packshot -->
    <rect x="650" y="170" width="480" height="130" rx="16" fill="#ffffff" stroke="#cfddd8" stroke-width="2"/>
    <rect x="672" y="192" width="86" height="86" rx="10" fill="#f4f6f4" stroke="#dfe6e2" stroke-width="2"/>
    <rect x="700" y="212" width="30" height="46" rx="6" fill="#3f7d6e"/>
    <rect x="700" y="228" width="30" height="14" fill="#f4f1e6"/>
    <text x="790" y="232" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f4c4c">1 · White packshot</text>
    <text x="790" y="264" font-family="Arial, sans-serif" font-size="18" fill="#5a6b66">Amazon main image · pure white</text>
    <!-- 2 lifestyle -->
    <rect x="650" y="320" width="480" height="130" rx="16" fill="#ffffff" stroke="#cfddd8" stroke-width="2"/>
    <rect x="672" y="342" width="86" height="86" rx="10" fill="#e8f0e6" stroke="#dfe6e2" stroke-width="2"/>
    <circle cx="700" cy="368" r="12" fill="#e8c96a"/>
    <rect x="700" y="388" width="30" height="40" rx="6" fill="#3f7d6e"/>
    <text x="790" y="382" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f4c4c">2 · Lifestyle scene</text>
    <text x="790" y="414" font-family="Arial, sans-serif" font-size="18" fill="#5a6b66">Same SKU, new background</text>
    <!-- 3 infographic -->
    <rect x="650" y="470" width="480" height="130" rx="16" fill="#ffffff" stroke="#cfddd8" stroke-width="2"/>
    <rect x="672" y="492" width="86" height="86" rx="10" fill="#fdf3e3" stroke="#e8d9b8" stroke-width="2"/>
    <rect x="688" y="512" width="54" height="8" rx="4" fill="#c96a2e"/>
    <rect x="688" y="528" width="40" height="8" rx="4" fill="#8a9a94"/>
    <rect x="688" y="544" width="48" height="8" rx="4" fill="#8a9a94"/>
    <text x="790" y="532" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f4c4c">3 · Listing infographic</text>
    <text x="790" y="564" font-family="Arial, sans-serif" font-size="18" fill="#5a6b66">Specs last — text added by hand</text>
  </g>

  <!-- Cost chips strip -->
  <g>
    <rect x="60" y="700" width="330" height="110" rx="16" fill="#0f4c4c"/>
    <text x="225" y="742" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Cost per image</text>
    <text x="225" y="778" font-family="Arial, sans-serif" font-size="20" fill="#a8d8d0" text-anchor="middle">≈ $0.01 – $0.44</text>
    <rect x="420" y="700" width="330" height="110" rx="16" fill="#ffffff" stroke="#cfddd8" stroke-width="2"/>
    <text x="585" y="742" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f4c4c" text-anchor="middle">SKU stays identical</text>
    <text x="585" y="778" font-family="Arial, sans-serif" font-size="20" fill="#5a6b66" text-anchor="middle">label · color · shape</text>
    <rect x="780" y="700" width="360" height="110" rx="16" fill="#ffffff" stroke="#cfddd8" stroke-width="2"/>
    <text x="960" y="742" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f4c4c" text-anchor="middle">Commercial rights</text>
    <text x="960" y="778" font-family="Arial, sans-serif" font-size="20" fill="#5a6b66" text-anchor="middle">check the plan terms</text>
  </g>
</svg>
