<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="How an AI coding assistant works in VS Code: autocomplete, chat, and agent edits">
  <rect width="1200" height="900" fill="#e8edf0"/>
  <rect x="0" y="0" width="1200" height="120" fill="#0e2a3f"/>
  <text x="600" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Coding Assistant for VS Code</text>
  <text x="600" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#aec6d8" text-anchor="middle">Type, ask, and let the agent edit — inside your editor</text>

  <!-- Editor window -->
  <g>
    <rect x="60" y="180" width="1080" height="400" rx="16" fill="#14202e"/>
    <rect x="60" y="180" width="1080" height="56" rx="16" fill="#1d3247"/>
    <rect x="60" y="210" width="1080" height="26" fill="#1d3247"/>
    <circle cx="95" cy="208" r="9" fill="#e06c5a"/>
    <circle cx="125" cy="208" r="9" fill="#e8c96a"/>
    <circle cx="155" cy="208" r="9" fill="#2f9e6e"/>
    <rect x="190" y="192" width="180" height="32" rx="8" fill="#24384e"/>
    <text x="280" y="214" font-family="'Courier New', monospace" font-size="20" fill="#aec6d8" text-anchor="middle">assistant.ts</text>

    <text x="100" y="292" font-family="'Courier New', monospace" font-size="22" fill="#5a7488">1</text>
    <text x="140" y="292" font-family="'Courier New', monospace" font-size="22" fill="#7fb3d5">def sort(items):</text>
    <text x="100" y="332" font-family="'Courier New', monospace" font-size="22" fill="#5a7488">2</text>
    <text x="140" y="332" font-family="'Courier New', monospace" font-size="22" fill="#2f9e6e">    return sorted(items)</text>
    <text x="100" y="392" font-family="'Courier New', monospace" font-size="22" fill="#5a7488">3</text>
    <text x="140" y="392" font-family="'Courier New', monospace" font-size="22" fill="#e8c96a">// STEP 1 · Autocomplete — <tspan fill="#d7dee8">ghost text, Tab to accept</tspan></text>
    <text x="100" y="442" font-family="'Courier New', monospace" font-size="22" fill="#5a7488">4</text>
    <text x="140" y="442" font-family="'Courier New', monospace" font-size="22" fill="#e8c96a">// STEP 2 · Chat with code — <tspan fill="#d7dee8">explain, debug, rewrite</tspan></text>
    <text x="100" y="492" font-family="'Courier New', monospace" font-size="22" fill="#5a7488">5</text>
    <text x="140" y="492" font-family="'Courier New', monospace" font-size="22" fill="#e8c96a">// STEP 3 · Agent edits — <tspan fill="#d7dee8">multi-file, you approve</tspan></text>
    <text x="100" y="542" font-family="'Courier New', monospace" font-size="22" fill="#5a7488">6</text>
    <text x="140" y="542" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#2f9e6e">+ 3 files    ✓ tests pass</text>
  </g>

  <!-- Bottom strip -->
  <g>
    <rect x="60" y="630" width="1080" height="180" rx="20" fill="#0e2a3f"/>
    <text x="600" y="685" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">What to check before you install</text>
    <text x="200" y="735" font-family="Arial, sans-serif" font-size="22" fill="#e8edf0" text-anchor="middle">Still maintained?</text>
    <text x="600" y="735" font-family="Arial, sans-serif" font-size="22" fill="#e8edf0" text-anchor="middle">Free tier limits?</text>
    <text x="1000" y="735" font-family="Arial, sans-serif" font-size="22" fill="#e8edf0" text-anchor="middle">Your code stays private?</text>
    <text x="200" y="770" font-family="Arial, sans-serif" font-size="20" fill="#aec6d8" text-anchor="middle">or a shutdown date</text>
    <text x="600" y="770" font-family="Arial, sans-serif" font-size="20" fill="#aec6d8" text-anchor="middle">2,000 completions a month</text>
    <text x="1000" y="770" font-family="Arial, sans-serif" font-size="20" fill="#aec6d8" text-anchor="middle">on-prem or zero retention</text>
  </g>
</svg>
