    <rect x="460" y="230" width="130" height="70" rx="6" fill="url(#lap)" opacity="0.85"/>
    <rect x="440" y="320" width="170" height="10" rx="5" fill="#8fa3c8"/>
    <rect x="630" y="220" width="150" height="100" rx="10" fill="#ffffff" opacity="0.07" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="640" y="230" width="130" height="70" rx="6" fill="url(#lap)" opacity="0.85"/>
    <rect x="620" y="320" width="170" height="10" rx="5" fill="#8fa3c8"/>
    <rect x="810" y="220" width="150" height="100" rx="10" fill="#ffffff" opacity="0.07" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="820" y="230" width="130" height="70" rx="6" fill="url(#lap)" opacity="0.85"/>
    <rect x="800" y="320" width="170" height="10" rx="5" fill="#8fa3c8"/>
    <rect x="990" y="220" width="150" height="100" rx="10" fill="#ffffff" opacity="0.07" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
