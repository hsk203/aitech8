<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="AI transcription for podcasters: raw episode audio becomes a speaker-labelled transcript">
  <rect width="1200" height="900" fill="#f4f1ea"/>

  <!-- left title column -->
  <g>
    <text x="64" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="bold" fill="#1f2a44">AI</text>
    <text x="64" y="218" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="bold" fill="#1f2a44">Transcription</text>
    <text x="64" y="286" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="bold" fill="#1f2a44">for Podcasters</text>
    <rect x="64" y="316" width="72" height="6" fill="#d9932c"/>
    <text x="64" y="362" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5a6472">Audio in, a speaker-labelled</text>
    <text x="64" y="396" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5a6472">transcript out</text>
  </g>

  <!-- left stat chips, stacked -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold">
    <rect x="64" y="450" width="260" height="64" rx="32" fill="#ffffff" stroke="#d8d2c4" stroke-width="2"/>
    <circle cx="100" cy="482" r="10" fill="#2a7f6f"/>
    <text x="124" y="490" fill="#1f2a44">Speaker labels</text>
    <rect x="64" y="534" width="260" height="64" rx="32" fill="#ffffff" stroke="#d8d2c4" stroke-width="2"/>
    <circle cx="100" cy="566" r="10" fill="#d9932c"/>
    <text x="124" y="574" fill="#1f2a44">SRT + TXT export</text>
    <rect x="64" y="618" width="260" height="64" rx="32" fill="#ffffff" stroke="#d8d2c4" stroke-width="2"/>
    <circle cx="100" cy="650" r="10" fill="#7a5fb0"/>
    <text x="124" y="658" fill="#1f2a44">Show notes ready</text>
  </g>

  <!-- audio player card -->
  <g>
    <rect x="380" y="100" width="760" height="300" rx="20" fill="#ffffff" stroke="#d8d2c4" stroke-width="2"/>
    <text x="420" y="152" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#8a94a3">EPISODE 42 · 60 MIN · MP3</text>
    <circle cx="440" cy="240" r="42" fill="#2a7f6f"/>
    <polygon points="430,216 430,264 466,240" fill="#ffffff"/>
    <g>
      <rect x="510" y="220" width="10" height="40" rx="5" fill="#2a7f6f"/>
      <rect x="528" y="200" width="10" height="80" rx="5" fill="#2a7f6f"/>
      <rect x="546" y="232" width="10" height="16" rx="5" fill="#d9932c"/>
      <rect x="564" y="208" width="10" height="64" rx="5" fill="#2a7f6f"/>
      <rect x="582" y="188" width="10" height="104" rx="5" fill="#2a7f6f"/>
      <rect x="600" y="226" width="10" height="28" rx="5" fill="#d9932c"/>
      <rect x="618" y="196" width="10" height="88" rx="5" fill="#2a7f6f"/>
      <rect x="636" y="216" width="10" height="48" rx="5" fill="#2a7f6f"/>
      <rect x="654" y="236" width="10" height="12" rx="5" fill="#d9932c"/>
      <rect x="672" y="204" width="10" height="72" rx="5" fill="#2a7f6f"/>
      <rect x="690" y="184" width="10" height="112" rx="5" fill="#2a7f6f"/>
      <rect x="708" y="222" width="10" height="36" rx="5" fill="#d9932c"/>
      <rect x="726" y="198" width="10" height="84" rx="5" fill="#2a7f6f"/>
      <rect x="744" y="228" width="10" height="24" rx="5" fill="#2a7f6f"/>
      <rect x="762" y="206" width="10" height="68" rx="5" fill="#d9932c"/>
      <rect x="780" y="190" width="10" height="100" rx="5" fill="#2a7f6f"/>
      <rect x="798" y="224" width="10" height="32" rx="5" fill="#2a7f6f"/>
      <rect x="816" y="202" width="10" height="76" rx="5" fill="#d9932c"/>
      <rect x="834" y="216" width="10" height="48" rx="5" fill="#2a7f6f"/>
      <rect x="852" y="192" width="10" height="96" rx="5" fill="#2a7f6f"/>
      <rect x="870" y="230" width="10" height="20" rx="5" fill="#d9932c"/>
      <rect x="888" y="208" width="10" height="64" rx="5" fill="#2a7f6f"/>
      <rect x="906" y="218" width="10" height="44" rx="5" fill="#2a7f6f"/>
      <rect x="924" y="196" width="10" height="88" rx="5" fill="#d9932c"/>
      <rect x="942" y="226" width="10" height="28" rx="5" fill="#2a7f6f"/>
      <rect x="960" y="204" width="10" height="72" rx="5" fill="#2a7f6f"/>
      <rect x="978" y="234" width="10" height="16" rx="5" fill="#d9932c"/>
      <rect x="996" y="210" width="10" height="60" rx="5" fill="#2a7f6f"/>
      <rect x="1014" y="222" width="10" height="36" rx="5" fill="#2a7f6f"/>
      <rect x="1032" y="198" width="10" height="84" rx="5" fill="#d9932c"/>
      <rect x="1050" y="228" width="10" height="24" rx="5" fill="#2a7f6f"/>
      <rect x="1068" y="212" width="10" height="56" rx="5" fill="#2a7f6f"/>
    </g>
    <text x="420" y="348" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#8a94a3">00:00</text>
    <text x="1020" y="348" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#8a94a3">60:00</text>
    <rect x="500" y="338" width="480" height="6" rx="3" fill="#e3ded2"/>
    <rect x="500" y="338" width="180" height="6" rx="3" fill="#2a7f6f"/>
  </g>

  <!-- arrow down from player to transcript -->
  <g>
    <line x1="760" y1="400" x2="760" y2="446" stroke="#d9932c" stroke-width="5"/>
    <polygon points="744,446 776,446 760,470" fill="#d9932c"/>
  </g>

  <!-- transcript card -->
  <g>
    <rect x="380" y="480" width="760" height="320" rx="20" fill="#1f2a44"/>
    <text x="420" y="532" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#9fb0c9">TRANSCRIPT · SPEAKER LABELS ON</text>
    <rect x="420" y="560" width="86" height="36" rx="18" fill="#2a7f6f"/>
    <text x="463" y="585" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">HOST</text>
    <text x="522" y="585" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#e8e4da">Welcome back — today we compare six tools…</text>
    <rect x="420" y="624" width="86" height="36" rx="18" fill="#d9932c"/>
    <text x="463" y="649" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">GUEST</text>
    <text x="522" y="649" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#e8e4da">The accuracy number is not the test…</text>
    <rect x="420" y="688" width="86" height="36" rx="18" fill="#2a7f6f"/>
    <text x="463" y="713" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">HOST</text>
    <text x="522" y="713" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#e8e4da">What does a weekly show actually cost?</text>
    <text x="420" y="768" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#9fb0c9">00:04:12 · 99% on clear audio · edited in Descript</text>
  </g>

  <!-- footer strip -->
  <text x="64" y="860" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#8a94a3">Descript · Sonix · Rev · Riverside · Otter · Whisper — compared for weekly shows</text>
</svg>
