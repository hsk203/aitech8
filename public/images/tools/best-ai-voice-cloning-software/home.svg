<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="AI voice cloning: record a short sample, verify it is you, and generate speech in any language">
  <rect width="1200" height="900" fill="#0e2233"/>
  <circle cx="1080" cy="120" r="180" fill="#12354a"/>
  <circle cx="90" cy="800" r="150" fill="#12354a"/>

  <!-- Title, top left -->
  <text x="70" y="105" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="bold" fill="#ffffff">AI Voice Cloning</text>
  <text x="70" y="155" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#8fd3c7">Your voice, speaking any language</text>
  <rect x="70" y="180" width="120" height="6" rx="3" fill="#2fbf9b"/>

  <!-- Left: microphone node -->
  <g>
    <circle cx="185" cy="390" r="95" fill="#14384e" stroke="#2fbf9b" stroke-width="3"/>
    <rect x="168" y="330" width="34" height="70" rx="17" fill="#2fbf9b"/>
    <path d="M 155 385 a 30 30 0 0 0 60 0" stroke="#2fbf9b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <rect x="181" y="412" width="8" height="26" fill="#2fbf9b"/>
    <rect x="163" y="438" width="44" height="8" rx="4" fill="#2fbf9b"/>
    <text x="185" y="530" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">1–2 min sample</text>
  </g>

  <!-- Centre: waveform bars -->
  <g fill="#2fbf9b">
    <rect x="330" y="360" width="16" height="60" rx="8"/>
    <rect x="356" y="330" width="16" height="120" rx="8"/>
    <rect x="382" y="350" width="16" height="80" rx="8"/>
    <rect x="408" y="310" width="16" height="160" rx="8"/>
    <rect x="434" y="345" width="16" height="90" rx="8"/>
    <rect x="460" y="325" width="16" height="130" rx="8"/>
    <rect x="486" y="360" width="16" height="60" rx="8"/>
    <rect x="512" y="335" width="16" height="110" rx="8"/>
    <rect x="538" y="355" width="16" height="70" rx="8"/>
    <rect x="564" y="320" width="16" height="140" rx="8"/>
    <rect x="590" y="350" width="16" height="80" rx="8"/>
    <rect x="616" y="330" width="16" height="120" rx="8"/>
    <rect x="642" y="360" width="16" height="60" rx="8"/>
    <rect x="668" y="340" width="16" height="100" rx="8"/>
    <rect x="694" y="365" width="16" height="50" rx="8"/>
  </g>
  <text x="525" y="530" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">AI builds the clone</text>

  <!-- Right: speaker node -->
  <g>
    <circle cx="895" cy="390" r="95" fill="#14384e" stroke="#f2b544" stroke-width="3"/>
    <path d="M 845 360 L 875 360 L 905 335 L 905 445 L 875 420 L 845 420 Z" fill="#f2b544"/>
    <path d="M 925 360 a 45 45 0 0 1 0 60" stroke="#f2b544" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M 945 340 a 75 75 0 0 1 0 100" stroke="#f2b544" stroke-width="7" fill="none" stroke-linecap="round"/>
    <text x="895" y="530" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Speaks 30+ languages</text>
  </g>

  <!-- Arrows between nodes -->
  <path d="M 290 390 L 318 390 M 304 376 L 322 390 L 304 404" stroke="#8fd3c7" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 720 390 L 748 390 M 734 376 L 752 390 L 734 404" stroke="#8fd3c7" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom: credit meter -->
  <g>
    <rect x="70" y="590" width="1060" height="210" rx="20" fill="#14384e"/>
    <text x="110" y="645" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">What a month buys — count characters, not credits</text>
    <rect x="110" y="675" width="980" height="26" rx="13" fill="#0e2233"/>
    <rect x="110" y="675" width="180" height="26" rx="13" fill="#2fbf9b"/>
    <rect x="290" y="675" width="330" height="26" fill="#2fbf9b" opacity="0.75"/>
    <rect x="620" y="675" width="470" height="26" rx="13" fill="#2fbf9b" opacity="0.5"/>
    <text x="110" y="740" font-family="Arial, sans-serif" font-size="21" fill="#8fd3c7">Free · ~10 min</text>
    <text x="470" y="740" font-family="Arial, sans-serif" font-size="21" fill="#8fd3c7">Starter · ~30 min</text>
    <text x="840" y="740" font-family="Arial, sans-serif" font-size="21" fill="#8fd3c7">Creator · ~2 hours</text>
    <text x="110" y="778" font-family="Arial, sans-serif" font-size="20" fill="#c7d6de">Verify consent first — then check the commercial licence on your plan</text>
  </g>
</svg>
