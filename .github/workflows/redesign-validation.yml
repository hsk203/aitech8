name: Redesign branch validation

on:
  push:
    branches:
      - redesign/professional-ai-editorial

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC_SITE_LANGUAGE: en
      SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format redesigned files
        run: |
          pnpm exec prettier --write src/pages/index.astro 'src/pages/posts/[...id].astro' src/layouts/BlogLayout.astro src/components/header/Welcome.astro src/components/header/Navigation.vue src/components/header/Search.vue src/styles/global.css src/site.config.json src/i18n/en.json
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/pages/index.astro 'src/pages/posts/[...id].astro' src/layouts/BlogLayout.astro src/components/header/Welcome.astro src/components/header/Navigation.vue src/styles/global.css src/site.config.json src/i18n/en.json
            git commit -m "Format redesigned AITech8 files"
            git push
          fi
      - name: Verify formatting of redesigned files
        run: pnpm exec prettier --check src/pages/index.astro 'src/pages/posts/[...id].astro' src/layouts/BlogLayout.astro src/components/header/Welcome.astro src/components/header/Navigation.vue src/styles/global.css src/site.config.json src/i18n/en.json
      - name: Build English site
        run: pnpm build
